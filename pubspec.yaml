name: frames
description: "Matt's Tools: a dock, Amphetamine, Frames and Toasty in one app."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  glacier:
    path: packages/glacier

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/css/ink.css
    - assets/css/app.css
  fonts:
    - family: Inter Variable
      fonts:
        - asset: assets/fonts/InterVariable-latin.ttf
        - asset: assets/fonts/InterVariable-latin-Italic.ttf
          style: italic
    - family: Inter Variable LatinExt
      fonts:
        - asset: assets/fonts/InterVariable-latin-ext.ttf
